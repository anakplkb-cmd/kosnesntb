  st=[['Pemilik Kos',o.filter(x=>x.role==='owner').length,'users','owners'],['Langganan Aktif',s.filter(x=>ids.has(x.owner_id)&&x.status==='aktif').length,'card','owners'],['Menunggu Verifikasi',p.filter(pend).length,'receipt','subpay'],['Masa Trial',s.filter(x=>ids.has(x.owner_id)&&x.status==='trial').length,'bell','owners']]}
 else if(r==='resident'){const[rm]=await DB.list('rooms',{id:u.room_id});const iv=(await DB.list('invoices',{resident_id:u.id})).filter(x=>x.status!=='lunas');
  hero=['Kamar Anda',rm?'No. '+rm.no_kamar:'-'];

 else{const[rm,iv,pay,cp]=await Promise.all(['rooms','invoices','rent_payments','complaints'].map(L));const m=today().slice(0,7);
  hero=['Pendapatan Bulan Ini',rp(sum(pay.filter(x=>x.status==='diterima'&&String(x.created_at).startsWith(m)),'nominal'))];

 $('#main').innerHTML=`${S.lock?`<div class="card warn">Langganan berakhir, aplikasi dalam mode baca saja. ${r==='owner'?'<a onclick="A.go(\'sub\')">Perpanjang sekarang</a>':'Hubungi pemilik kos.'}</div>`:''}<div class="hero"><small>${hero[0]}</small><h1>${hero[1]}</h1>${hero[2]?`<p>${hero[2]}</p>`:''}${r==='owner'&&S.sub?`<p>Paket ${E(S.plan&&S.plan.nama||'-')} \u2022 ${S.sub.status} sampai ${fd(S.sub.berakhir)}</p>`:''}</div><div class="g2">${st.map(x=>`<div class="card stt" onclick="A.go('${x[3]}')"><span class="ico">${ic(x[2])}</span><h2>${x[1]}</h2><small>${x[0]}</small></div>`).join('')}</div>${extra}`}

async function crud(id){
 const c=C[id];if(!c)throw Error('Menu tidak ditemukan');S.c=c;S.ci=id;
 for(const t of c.lk||[])LK[t]=idx(await DB.list(t,wF(t)));

 $('#main').innerHTML=`<div class="tt"><h2>${c.title}</h2></div><div class="sbar"><input placeholder="Cari data\u2026" oninput="A.q(this.value)">${!c.ro&&!c.noadd?`<button class="btn sq" aria-label="Tambah" onclick="A.add()">${ic('plus',22)}</button>`:''}</div>${(c.top||[]).length?`<div class="tops">${c.top.map(x=>`<button class="btn o w" onclick="A.${x[1]}()">${x[0]}</button>`).join('')}</div>`:''}<div id="lst"></div>`;
 list()}
function list(){
 const c=S.c,q=(S.q||'').toLowerCase();

async function fld(f,v,ed){
 const[k,l,t,o]=f,req=!/opsional/i.test(l)&&!(t==='password'&&ed);v=v==null?'':v;let h=`<label>${l}</label>`;
 if(t==='select'){let op=o;if(o&&o.t){const rs=await DB.list(o.t,wF(o.t));LK[o.t]=idx(rs);op=rs.map(x=>[x.id,o.l(x)])}
  h+=`<select name="${k}" ${req?'required':''}><option value="">-- pilih --</option>${op.map(x=>{x=Array.isArray(x)?x:[x,x];return `<option value="${E(x[0])}"${x[0]==v?' selected':''}>${E(x[1])}</option>`}).join('')}</select>`}
 else if(t==='textarea')h+=`<textarea name="${k}" rows="3" ${req?'required':''}>${E(v)}</textarea>`;
 else h+=`<input name="${k}" type="${t}" value="${t==='password'?'':E(v)}" ${req?'required':''} ${t==='password'&&ed?'placeholder="Kosongkan jika tidak diubah"':''}>`;
 return h}
async function frm(){
 const c=S.c,r=S.ed,fs=[];for(const f of c.f)fs.push(await fld(f,r?r[f[0]]:'',!!r));
 modal(`<h2>${r?'Ubah':'Tambah'} ${c.title}</h2><form onsubmit="A.save(event)">${fs.join('')}<div class="fr"><button class="btn w">Simpan</button>${r&&!(c.nodel&&c.nodel(r))?'<button type="button" class="btn d w" onclick="A.rm()">Hapus</button>':''}</div></form>`)}

 <div class="tg"><button id="tb" onclick="A.cy('bulanan')">Bulanan</button><button id="ty" onclick="A.cy('tahunan')">Tahunan (hemat 2 bulan)</button></div><div id="pc" style="display:grid;gap:12px"></div>
 <h3 style="margin:18px 0 10px">Riwayat Pembayaran</h3><div id="lst">${ps.map(x=>`<div class="card row"><div class="rb"><b>${E(x.paket)} \u2022 ${x.siklus}</b><small>${rp(x.nominal)} \u2022 ${fd(x.created_at)}</small></div><span class="bd ${BC[x.status]||'b'}">${x.status}</span></div>`).join('')||'<div class="card em">Belum ada pembayaran</div>'}</div>`;
 A.cy('bulanan')}
function prof(){
 const u=S.u;$('#main').innerHTML=`<div class="card" style="text-align:center;margin-bottom:12px"><div class="av big">${E(u.nama[0])}</div><h2>${E(u.nama)}</h2><small>${ROLE[S.role]}</small></div><div class="card" style="margin-bottom:12px">${[['Email',u.email],['Username',u.username],['WhatsApp',u.no_wa],['Usaha',u.nama_usaha]].filter(x=>x[1]).map(x=>`<div class="kv"><span>${x[0]}</span><b>${E(x[1])}</b></div>`).join('')}</div><button class="btn d w" onclick="A.out()">${ic('logout',16)} Keluar</button>`}

async function loadSub(){
 S.sub=S.plan=null;S.lock=false;if(S.role==='superadmin')return;
 const[s]=await DB.list('subscriptions',{owner_id:oid()});S.sub=s||null;
 if(s){[S.plan]=await DB.list('plans',{id:s.plan_id})}

async function enter(role,u){
 if(role==='staff'||role==='resident'){const[ow]=await DB.list('owners',{id:u.owner_id});if(ow&&ow.status==='ditangguhkan'){try{localStorage.removeItem('kn')}catch(x){}throw Error('Akun kos ini ditangguhkan. Hubungi pemilik kos.')}}S.role=role;S.u=u;S.v='dash';await loadSub();shell();view()}

const A=window.A={
cl(){$('#mo').innerHTML=''},
go(v){S.v=v;S.q='';shell();view()},
menu(){modal(`<h2>Semua Menu</h2><div class="gm">${MENU[S.role].map(x=>`<button onclick="A.cl();A.go('${x[0]}')"><span>${ic(x[2],22)}</span>${x[1]}</button>`).join('')}</div>`)},
tab(t){S.tab=t;S.reg=0;login()},rg(v){S.reg=v;login()},
q(v){S.q=v;list()},
async login(e){e.preventDefault();const f=e.target,t=S.tab;
 try{if(IS_PREVIEW)return toast('Mode preview: gunakan tombol Quick Login.');
  if(t==='owner'){const{data,error}=await sb.auth.signInWithPassword({email:f.u.value.trim(),password:f.p.value});if(error)throw error;try{localStorage.removeItem('kn')}catch(x){}await enterOwner(data.user.id)}

 }catch(x){toast(x.message,1)}},

 try{if(IS_PREVIEW)return toast('Pendaftaran dinonaktifkan di mode preview.');

async add(){if(S.lock)return toast(LOCKMSG,1);const c=S.c;if(c.lim&&S.plan&&S.rows.length>=S.plan[c.lim])return toast('Batas paket tercapai. Upgrade di menu Langganan.',1);S.ed=null;await frm()},
async edit(i){const c=S.c;if(c.ro||!c.f.length)return;if(S.lock)return toast(LOCKMSG,1);S.ed=S.rows[i];await frm()},
async save(e){e.preventDefault();const c=S.c,r=S.ed,o={};
 try{for(const f of c.f){let v=e.target[f[0]].value.trim();if(f[2]==='number')v=v===''?null:Number(v);else if(v==='')v=null;if(f[2]==='password'&&v===null)continue;o[f[0]]=v}
  if(!r&&c.own)o.owner_id=oid();if(c.pre)c.pre(o);
  if(r)await DB.upd(c.t,r.id,o);else await DB.add(c.t,o);
  if(c.after)await c.after({...r,...o});
  log((r?'Mengubah ':'Menambah ')+c.title);A.cl();toast('Tersimpan');await crud(S.ci)}catch(x){toast(x.message,1)}},
async rm(){if(S.c.nodel&&S.c.nodel(S.ed))return toast('Akun Super Admin tidak dapat dihapus.',1);if(!confirm('Hapus data ini?'+(S.c.t==='owners'?' Seluruh data kos milik pemilik ini ikut terhapus.':'')))return;try{if(S.c.t==='owners'&&!IS_PREVIEW){const{error}=await sb.rpc('admin_delete_owner',{p_id:S.ed.id});if(error)throw error}else await DB.del(S.c.t,S.ed.id);log('Menghapus '+S.c.title);A.cl();toast('Terhapus');await crud(S.ci)}catch(x){toast(x.message,1)}},
open(i){const c=S.c,r=S.rows[i],b=c.bd?c.bd(r):'',acts=(c.act||[]).filter(a=>!a[2]||a[2](r)),can=!c.ro&&c.f.length;

async act(i,l){const c=S.c,r=S.rows[i],a=c.act.find(x=>x[0]===l);if(S.lock&&!['Bukti','WA'].includes(l))return toast(LOCKMSG,1);
 try{await a[1](r);await crud(S.ci)}catch(x){toast(x.message,1)}},
async genInv(){if(S.lock)return toast(LOCKMSG,1);
 try{const rs=(await DB.list('residents',wF('residents'))).filter(x=>x.status==='aktif'&&x.room_id);
  const[rm,pr,iv]=await Promise.all([DB.list('rooms',wF('rooms')),DB.list('properties',wF('properties')),DB.list('invoices',wF('invoices'))]);
  const R=idx(rm),P=idx(pr),pe=today().slice(0,7);let n=0;
  for(const x of rs){if(iv.some(v=>v.resident_id===x.id&&v.periode===pe))continue;
   const d=String(P[x.property_id]&&P[x.property_id].tgl_jatuh_tempo||5).padStart(2,'0');
   await DB.add('invoices',{owner_id:oid(),property_id:x.property_id,resident_id:x.id,periode:pe,nominal:R[x.room_id]?R[x.room_id].harga_bulanan:0,jatuh_tempo:`${pe}-${d}`,status:'belum'});n++}
  log('Membuat '+n+' tagihan '+pe);toast(n+' tagihan baru dibuat');await crud('invoices')}catch(x){toast(x.message,1)}},

 catch(x){btn.disabled=false;btn.textContent='Kirim Bukti';toast(x.message,1)}},
